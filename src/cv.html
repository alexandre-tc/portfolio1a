<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CV - Alexandre Triniol--Crozatier</title>
    <link rel="icon" href="../images/ordinateur.png" type="image/png">
    <link rel="stylesheet" href="../style/cv.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Manrope:wght@400;600&family=Poiret+One&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <div class="burger-menu">
                <div class="burger-icon" id="burger-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <div class="nav-links" id="nav-links">
                <a href="accueil.html" title="Accueil">Accueil</a>
                <a href="aPropos.html" title="À propos de moi">À propos de moi</a>
                <a href="projets.html" title="Mes projets">Mes projets</a>
                <a href="experience.html" title="Mes expériences professionnelles">Expériences</a>
                <a href="contact.html" title="Me contacter">Me contacter</a>
                <a href="cv.html" class="active" title="Mon CV">Mon CV</a>
            </div>
        </nav>
    </header>

    <main class="page-wrapper">
        <div class="cv-document">

            <!-- Ligne scanner (animation au chargement) -->
            <div class="scanner-line"></div>

            <!-- En-tête du document -->
            <div class="doc-header">
                <div class="doc-lines" aria-hidden="true">
                    <span style="width: 38px;"></span>
                    <span style="width: 62px;"></span>
                    <span style="width: 48px;"></span>
                </div>
                <h1 class="doc-title">Curriculum Vitæ</h1>
                <p class="doc-name">Alexandre Triniol--Crozatier</p>
            </div>

            <!-- Corps du document -->
            <div class="doc-body">
                <div class="doc-meta">
                    <span class="meta-label">Format</span>
                    <span class="meta-value">PDF</span>
                </div>
                <div class="doc-meta">
                    <span class="meta-label">Mise à jour</span>
                    <span class="meta-value">Juin 2026</span>
                </div>
                <div class="doc-meta">
                    <span class="meta-label">Pages</span>
                    <span class="meta-value">1</span>
                </div>

                <a href="../doc/cv.pdf" class="download-btn" target="_blank" title="Télécharger mon CV">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                        class="download-arrow">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Télécharger mon CV
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p>© Mon portfolio - 2025 | Développé par Alexandre Triniol--Crozatier</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 300);

            const burgerIcon = document.getElementById('burger-icon');
            const navLinks = document.getElementById('nav-links');

            if (burgerIcon && navLinks) {
                burgerIcon.addEventListener('click', function (e) {
                    e.stopPropagation();
                    this.classList.toggle('active');
                    navLinks.classList.toggle('active');
                    document.body.style.overflow = this.classList.contains('active') ? 'hidden' : '';
                });

                document.addEventListener('click', function (e) {
                    if (navLinks.classList.contains('active') &&
                        !navLinks.contains(e.target) &&
                        !burgerIcon.contains(e.target)) {
                        burgerIcon.classList.remove('active');
                        navLinks.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                });

                const navLinksElements = navLinks.querySelectorAll('a');
                navLinksElements.forEach(link => {
                    link.addEventListener('click', function () {
                        burgerIcon.classList.remove('active');
                        navLinks.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                });

                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && navLinks.classList.contains('active')) {
                        burgerIcon.classList.remove('active');
                        navLinks.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                });

                burgerIcon.setAttribute('role', 'button');
                burgerIcon.setAttribute('aria-label', 'Menu de navigation');
                burgerIcon.setAttribute('aria-expanded', 'false');

                const observer = new MutationObserver(() => {
                    const isActive = burgerIcon.classList.contains('active');
                    burgerIcon.setAttribute('aria-expanded', isActive);
                });

                observer.observe(burgerIcon, { attributes: true, attributeFilter: ['class'] });
            }

            if (window.innerWidth <= 768) {
                const links = document.querySelectorAll('.nav-links a');
                links.forEach((link, index) => {
                    link.style.setProperty('--i', index);
                });
            }

            let resizeTimer;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (window.innerWidth > 768) {
                        burgerIcon?.classList.remove('active');
                        navLinks?.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                }, 250);
            });
        });
    </script>

</body>

</html>
