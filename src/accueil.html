<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Alexandre Triniol--Crozatier</title>
    <link rel="icon" href="../images/ordinateur.png" type="image/png">
    <link rel="stylesheet" href="../style/accueil.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Manrope:wght@400;600&family=Poiret+One&display=swap" rel="stylesheet">
</head>

<body>
    <div class="video-container">
        <video class="video-background" autoplay muted loop playsinline>
            <source src="../videos/dev-web.mp4" type="video/mp4">
            <img src="../images/image.png" alt="alternative">
        </video>
    </div>

    <header>
        <nav>
            <div class="burger-menu">
                <div class="burger-icon" id="burger-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <div class="nav-links" id="nav-links">
                <a href="accueil.html" class="active" title="Accueil">Accueil</a>
                <a href="aPropos.html" title="À propos de moi">À propos de moi</a>
                <a href="projets.html" title="Mes projets">Mes projets</a>
                <a href="contact.html" title="Me contacter">Me contacter</a>
                <a href="cv.html" title="Mon CV">Mon CV</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero-content">
            <h1>Alexandre Triniol--Crozatier</h1>
            <p class="subtitle">Étudiant en BUT Informatique</p>
            <div class="button-container">
                <a href="aPropos.html" class="cta-button">À propos de moi</a>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Démarrer vidéo
            const video = document.querySelector('.video-background');
            video.play().catch(e => console.log("Autoplay bloqué:", e));
            
            // Animation de chargement
            setTimeout(function() {
                document.body.classList.add('loaded');
            }, 100);
    
            // Gestion du menu burger - CORRECTION COMPLÈTE
            const burgerIcon = document.getElementById('burger-icon');
            const navLinks = document.getElementById('nav-links');
    
            if (burgerIcon && navLinks) {
                burgerIcon.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('active');
                    navLinks.classList.toggle('active');
                    document.body.classList.toggle('nav-active');
                });
    
                // Fermer le menu quand on clique en dehors
                document.addEventListener('click', function(e) {
                    if (navLinks.classList.contains('active') && 
                        !navLinks.contains(e.target) && 
                        !burgerIcon.contains(e.target)) {
                        closeMenu();
                    }
                });
    
                // Fermer le menu lors du clic sur un lien
                const navLinksElements = navLinks.querySelectorAll('a');
                navLinksElements.forEach(link => {
                    link.addEventListener('click', function() {
                        closeMenu();
                    });
                });
    
                // Fermer le menu sur la touche Échap
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && navLinks.classList.contains('active')) {
                        closeMenu();
                    }
                });
    
                // Fonction pour fermer le menu
                function closeMenu() {
                    burgerIcon.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.classList.remove('nav-active');
                }
    
                // Réinitialiser le menu burger si on passe en desktop
                let resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        if (window.innerWidth > 768) {
                            closeMenu();
                        }
                    }, 250);
                });
    
                // Amélioration de l'accessibilité
                burgerIcon.setAttribute('role', 'button');
                burgerIcon.setAttribute('aria-label', 'Menu de navigation');
                burgerIcon.setAttribute('aria-expanded', 'false');
    
                // Mise à jour de l'attribut aria-expanded
                const observer = new MutationObserver(() => {
                    const isActive = burgerIcon.classList.contains('active');
                    burgerIcon.setAttribute('aria-expanded', isActive);
                });
    
                observer.observe(burgerIcon, { attributes: true, attributeFilter: ['class'] });
            }
        });
    </script>
</body>
</html>
